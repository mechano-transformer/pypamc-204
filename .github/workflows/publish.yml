name: PyPI公開

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: ビルドツールのインストール
        run: pip install build

      - name: パッケージビルド
        run: python -m build

      - name: PyPIへ公開
        uses: pypa/gh-action-pypi-publish@release/v1
