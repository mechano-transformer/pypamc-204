[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypamc_204"
version = "0.1.0"
description = "Python driver for PAMC-204 / PAMC-204-RJ Piezo Assist Motor Controller"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/mechano-transformer/PAMC-204"
PyPI = "https://pypi.org/project/pypamc-204/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
